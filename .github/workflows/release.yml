name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOCKER_IMAGE: followthewhit3rabbit/forge-guardrails

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail

          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "forge-guardrails") | .version')"
          expected_tag="v${crate_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crate version ${crate_version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check all targets
        run: cargo check --workspace --all-targets --locked

      - name: Lint all targets
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test all targets
        run: cargo test --workspace --all-targets --locked

      - name: Package crate
        run: cargo package --locked

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  build-binary:
    name: Build ${{ matrix.suffix }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            suffix: linux-x86_64
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: windows-x86_64
            archive_ext: zip
          - target: aarch64-apple-darwin
            runner: macos-14
            suffix: macos-arm64
            archive_ext: zip
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: macos-x86_64
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Build proxy binary
        run: cargo build --release --locked --bin forge-guardrails-proxy --target ${{ matrix.target }}

      - name: Stage Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          mkdir -p dist
          cp "target/${TARGET}/release/forge-guardrails-proxy" dist/forge-guardrails-proxy
          cd dist
          archive="forge-guardrails-proxy-${ver}-${SUFFIX}.${ARCHIVE_EXT}"
          if [[ "${ARCHIVE_EXT}" == "tar.gz" ]]; then
            tar -czf "${archive}" forge-guardrails-proxy
          else
            zip "${archive}" forge-guardrails-proxy
          fi

      - name: Stage Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          $ver = $env:VERSION.TrimStart("v")
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item "target/$env:TARGET/release/forge-guardrails-proxy.exe" "dist/forge-guardrails-proxy.exe"
          Compress-Archive `
            -Path "dist/forge-guardrails-proxy.exe" `
            -DestinationPath "dist/forge-guardrails-proxy-$ver-$env:SUFFIX.zip" `
            -Force

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [publish, build-binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      arm_sha: ${{ steps.sha.outputs.arm }}
      x86_sha: ${{ steps.sha.outputs.x86 }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        id: sha
        run: |
          set -euo pipefail
          cd artifacts
          ver="${GITHUB_REF_NAME#v}"
          arm_archive="./forge-guardrails-proxy-${ver}-macos-arm64.zip"
          x86_archive="./forge-guardrails-proxy-${ver}-macos-x86_64.zip"
          echo "arm=$(sha256sum "${arm_archive}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "x86=$(sha256sum "${x86_archive}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  docker-preflight:
    name: Check Docker Hub credentials
    needs: [publish]
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.creds.outputs.available }}

    steps:
      # The secrets context is not available in a job-level `if`, so gate the
      # image jobs on an output instead. A fork without Docker Hub secrets
      # should skip publishing, not fail the release.
      - name: Detect Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; skipping image publish." >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    name: Build ${{ matrix.arch }} image
    needs: [docker-preflight]
    if: needs.docker-preflight.outputs.available == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each arch builds natively on its own runner and pushes by digest; the
      # manifest job stitches them together. Emulating an amd64 Rust release
      # build under QEMU takes hours, so the extra job is worth it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish Docker manifest
    needs: [docker-preflight, docker-build]
    if: needs.docker-preflight.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          # Word splitting is the point: one @sha256:... argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:${ver}" \
            -t "${DOCKER_IMAGE}:latest" \
            $(printf "${DOCKER_IMAGE}@sha256:%s " *)

      - name: Inspect published image
        run: docker buildx imagetools inspect "${DOCKER_IMAGE}:${GITHUB_REF_NAME#v}"

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        id: ver
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        if: steps.tap.outputs.available == 'true'
        uses: actions/checkout@v5
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate cask
        if: steps.tap.outputs.available == 'true'
        env:
          VER: ${{ steps.ver.outputs.VER }}
          ARM: ${{ needs.release.outputs.arm_sha }}
          X86: ${{ needs.release.outputs.x86_sha }}
        run: |
          chmod +x scripts/render_homebrew_cask.sh
          scripts/render_homebrew_cask.sh \
            packaging/homebrew/Casks/forge-guardrails-proxy.rb \
            homebrew-tap/Casks/forge-guardrails-proxy.rb \
            "${VER}" \
            "${ARM}" \
            "${X86}"
          ruby -c homebrew-tap/Casks/forge-guardrails-proxy.rb

      - name: Commit and push cask
        if: steps.tap.outputs.available == 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/forge-guardrails-proxy.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update forge-guardrails-proxy cask to ${{ steps.ver.outputs.VER }}"
          git push origin main
