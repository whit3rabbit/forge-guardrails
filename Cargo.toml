[package]
name = "forge-guardrails"
version = "0.1.3"
edition = "2021"
# The floor for THIS crate's own code, verified by building
# `--no-default-features --features guardrails` on 1.87. The DEFAULT feature
# set needs a much newer toolchain (1.95+), and that floor belongs to the
# transport dependencies rather than to anything here -- cargo refuses those
# by name, naming the package, which is a better error than a number here
# would be. Stated so a `guardrails`-only consumer is not turned away by a
# requirement that does not apply to it.
rust-version = "1.87"
license = "MIT"
description = "Foundation types for an LLM-agent workflow framework"
repository = "https://github.com/whit3rabbit/forge-guardrails"
homepage = "https://github.com/whit3rabbit/forge-guardrails"
readme = "README.md"

[features]
# `default` still turns everything on, so nothing that depended on 0.1.2
# changes: the split below is ADDITIVE.
default = ["proxy", "secrets-scanner"]

# The pure reliability stack, and nothing that opens a socket: response
# vocabulary, tool specs, prompts and nudges, rescue parsing, argument
# validation, step enforcement, tool policy, tool-output compression, schema
# compression. Its whole dependency set is serde, serde_json, thiserror,
# indexmap, regex-lite, anyhow, log and tracing.
#
# This exists so an engine that already HAS a model and a loop can take the
# guardrails without the transport half. Measured at the split: the full crate
# resolves 533 packages, this resolves a handful. `turbospark-server` in the
# mrefrust workspace is the first such caller -- it runs a local Metal model
# in-process, so every client, proxy route and process manager here is dead
# weight to it, and `sentry` / `clap` / `nix` / `axum` / `reqwest` / the four
# `anyllm_*` crates are reachable from nothing it calls.
guardrails = []

# Everything that talks to a backend or serves a request: `clients`, `proxy`,
# `server`, `core`'s workflow runner, and all three binaries.
proxy = [
    "guardrails",
    "dep:axum",
    "dep:reqwest",
    "dep:tokio",
    "dep:sentry",
    "dep:clap",
    "dep:nix",
    "dep:async-trait",
    "dep:async-stream",
    "dep:futures-util",
    "dep:futures-core",
    "dep:anyllm_translate",
    "dep:anyllm_proxy",
    "dep:anyllm_providers",
    "dep:anyllm_client",
]

classifier = [
    "dep:ort",
    "dep:tokenizers",
    "dep:hf-hub",
    "dep:ndarray",
]
secrets-scanner = ["dep:secrets_scanner"]

[dependencies]
# Unconditional: the `guardrails` feature's entire dependency set.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
log = "0.4"
tracing = "0.1"
regex-lite = "0.1"
anyhow = "1"

# Transport: gated behind `proxy`. Nothing in the pure stack reaches these.
futures-core = { version = "0.3", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"], optional = true }
sentry = { version = "0.48.2", default-features = false, features = ["backtrace", "panic", "reqwest", "rustls"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "signal", "time"], optional = true }
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }
axum = { version = "0.7", features = ["macros"], optional = true }
anyllm_translate = { version = "0.9.9", optional = true }
anyllm_proxy = { version = "0.9.9", optional = true }
anyllm_providers = { version = "0.9.9", optional = true }
anyllm_client = { version = "0.9.9", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
nix = { version = "0.29", features = ["signal", "process"], optional = true }

ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "api-24", "tls-rustls"], optional = true }
tokenizers = { version = "0.23.1", optional = true }
hf-hub = { version = "1.0.0-rc.1", optional = true, features = ["blocking", "rustls-tls"] }
ndarray = { version = "0.17.2", optional = true }
secrets_scanner = { version = "0.2.2", default-features = false, optional = true }

# All three binaries need a backend and a socket. Declared EXPLICITLY rather
# than left to cargo's `src/bin/*/main.rs` auto-discovery, because an
# auto-discovered binary carries no `required-features` and would be built --
# and fail -- under `--no-default-features`.
[[bin]]
name = "download-classifier"
path = "src/bin/download-classifier.rs"
required-features = ["classifier"]

[[bin]]
name = "forge-guardrails-proxy"
path = "src/bin/forge-guardrails-proxy/main.rs"
required-features = ["proxy"]

[[bin]]
name = "forge-dataset"
path = "src/bin/forge-dataset/main.rs"
required-features = ["proxy"]

[[bin]]
name = "forge-eval"
path = "src/bin/forge-eval/main.rs"
required-features = ["proxy"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
mockito = "1"
